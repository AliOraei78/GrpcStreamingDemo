syntax = "proto3";

option csharp_namespace = "GrpcStreamingDemo";

package greet;

// Service definition
service Greeter {
  // Unary RPC (single request → single response)
  rpc SayHello (HelloRequest) returns (HelloReply);
}

// Request message
message HelloRequest {
  string name = 1;
}

// Response message
message HelloReply {
  string message = 1;
}