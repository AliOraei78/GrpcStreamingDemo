syntax = "proto3";

option csharp_namespace = "GrpcStreamingDemo";

package greet;

service Greeter {
  // Unary
  rpc SayHello (HelloRequest) returns (HelloReply);

  // Server Streaming
  rpc SayHelloServerStream (HelloRequest) returns (stream HelloReply);

  // Client Streaming
  rpc SayHelloClientStream (stream HelloRequest) returns (HelloReply);

  // Bidirectional Streaming - implemented today
  rpc SayHelloBidirectional (stream HelloRequest) returns (stream HelloReply);

  // New validation method for error handling demo
  rpc SayHelloWithValidation (HelloRequest) returns (HelloReply);

  // New method for Deadline and Cancellation testing
  rpc SayHelloWithDelay (HelloRequest) returns (HelloReply);
}

message HelloRequest {
  string name = 1;
  string language = 2;
  string email = 3;
  int32 count = 4;
  string message = 5;
  int32 delaySeconds = 6;
}

message HelloReply {
  string message = 1;
  string timestamp = 2;
  int32 messageCount = 3;
  bool success = 4;
  int32 totalReceived = 5;
}

// Error detail message (for more professional error handling)
message ErrorDetail {
  string field = 1;
  string description = 2;
}