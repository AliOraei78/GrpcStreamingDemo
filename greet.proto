syntax = "proto3";

option csharp_namespace = "GrpcStreamingDemo";

package greet;

service Greeter {
  // Unary (previous days)
  rpc SayHello (HelloRequest) returns (HelloReply);

  // Server Streaming - implemented today
  rpc SayHelloServerStream (HelloRequest) returns (stream HelloReply);
}

message HelloRequest {
  string name = 1;
  string language = 2;
  string email = 3;
  int32 count = 4; // Number of messages to receive
}

message HelloReply {
  string message = 1;
  string timestamp = 2;
  int32 messageCount = 3;
  bool success = 4;
}