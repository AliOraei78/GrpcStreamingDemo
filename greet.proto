syntax = "proto3";

option csharp_namespace = "GrpcStreamingDemo";

package greet;

// Main service for this demo
service Greeter {
  // Unary RPC (Day 1)
  rpc SayHello (HelloRequest) returns (HelloReply);

  // Prepared for upcoming days
  rpc SayHelloServerStream (HelloRequest) returns (stream HelloReply);
  rpc SayHelloClientStream (stream HelloRequest) returns (HelloReply);
  rpc SayHelloBidirectional (stream HelloRequest) returns (stream HelloReply);
}

// Messages
message HelloRequest {
  string name = 1;
  string language = 2; // New field for future extensibility
}

message HelloReply {
  string message = 1;
  string timestamp = 2; // New field
  int32 messageCount = 3;
}