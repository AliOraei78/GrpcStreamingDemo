syntax = "proto3";

option csharp_namespace = "GrpcStreamingDemo";

package greet;

service Greeter {
  // Unary
  rpc SayHello (HelloRequest) returns (HelloReply);

  // Server Streaming
  rpc SayHelloServerStream (HelloRequest) returns (stream HelloReply);

  // Client Streaming
  rpc SayHelloClientStream (stream HelloRequest) returns (HelloReply);

  // Bidirectional Streaming - implemented today
  rpc SayHelloBidirectional (stream HelloRequest) returns (stream HelloReply);

  // New validation method for error handling demo
  rpc SayHelloWithValidation (HelloRequest) returns (HelloReply);

  // New method for Deadline and Cancellation testing
  rpc SayHelloWithDelay (HelloRequest) returns (HelloReply);

  // New method for Metadata & Headers demonstration
  rpc SayHelloWithMetadata (HelloRequest) returns (HelloReply);

  // ==================== CRUD User ====================
  rpc CreateUser (CreateUserRequest) returns (UserReply);
  rpc GetUser (GetUserRequest) returns (UserReply);
  rpc GetAllUsers (Empty) returns (UserListReply);           // Server Streaming later
  rpc UpdateUser (UpdateUserRequest) returns (UserReply);
  rpc DeleteUser (DeleteUserRequest) returns (DeleteReply);

  // Streaming
  rpc StreamUsers (Empty) returns (stream UserReply);        // Server Streaming
  rpc UserEvents (stream UserEventRequest) returns (stream UserEventReply); // Bidirectional
}

message HelloRequest {
  string name = 1;
  string language = 2;
  string email = 3;
  int32 count = 4;
  string message = 5;
  int32 delaySeconds = 6;
}

message HelloReply {
  string message = 1;
  string timestamp = 2;
  int32 messageCount = 3;
  bool success = 4;
  int32 totalReceived = 5;
}

// Error detail message (for more professional error handling)
message ErrorDetail {
  string field = 1;
  string description = 2;
}

// ==================== User Messages ====================
message Empty {}

message User {
  int32 id = 1;
  string name = 2;
  string email = 3;
  string role = 4;
  string createdAt = 5;
}

message CreateUserRequest {
  string name = 1;
  string email = 2;
  string role = 3;
}

message GetUserRequest {
  int32 id = 1;
}

message UpdateUserRequest {
  int32 id = 1;
  string name = 2;
  string email = 3;
  string role = 4;
}

message DeleteUserRequest {
  int32 id = 1;
}

message UserReply {
  User user = 1;
  bool success = 2;
  string message = 3;
  string timestamp = 4;
}

message UserListReply {
  repeated User users = 1;
  string message = 2;
}

message DeleteReply {
  bool success = 1;
  string message = 2;
}

message UserEventRequest {
  string action = 1; // "create", "update", "delete"
  User user = 2;
}

message UserEventReply {
  string eventType = 1;
  User user = 2;
  string timestamp = 3;
}